buildscript {
	repositories {
		maven { url "https://maven.architectury.dev/" }
		maven { url "https://maven.fabricmc.net/" }
		maven { url "https://maven.minecraftforge.net/" }
		mavenCentral()
		gradlePluginPortal()
	}
	dependencies {
		classpath "dev.architectury:architectury-loom:1.14.473"
		classpath "architectury-plugin:architectury-plugin.gradle.plugin:3.5.163"
	}
}

plugins {
	id 'io.github.goooler.shadow' version '8.1.7' apply false
}

apply plugin: 'architectury-plugin'

architectury {
	minecraft = project.minecraftVersion
}

allprojects {
	group = rootProject.group
	version = rootProject.modVersion
}

subprojects {
	apply plugin: 'dev.architectury.loom'
	apply plugin: 'architectury-plugin'

	base {
		archivesName = "$rootProject.name-$rootProject.minecraftVersion-$project.name"
	}

	repositories {
		maven {
			name = "CurseMaven"
			url = "https://www.cursemaven.com"
		}
	}

	dependencies {
		minecraft "net.minecraft:minecraft:$rootProject.minecraftVersion"
		mappings loom.officialMojangMappings()

		// Use dev JARs (named mappings) for both compile and runtime
		implementation fileTree(dir: "../libs-dev", include: ["*.jar"])
	}

	java {
		sourceCompatibility = JavaVersion.VERSION_21
		targetCompatibility = JavaVersion.VERSION_21
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 21
	}

	remapJar {
		destinationDirectory = file("$buildDir/../../output")
	}
}
