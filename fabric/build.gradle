plugins {
	id 'io.github.goooler.shadow'
}

architectury {
	platformSetupLoomIde()
	fabric()
}

loom {
	accessWidenerPath = file("${project(':common').projectDir}/src/main/resources/legendarytooltips.accesswidener")
}

configurations {
	common {
		canBeResolved = true
		canBeConsumed = false
	}
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentFabric.extendsFrom common

	// Files in this configuration will be bundled into your mod using the Shadow plugin.
	// Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
	shadowBundle {
		canBeResolved = true
		canBeConsumed = false
	}
}

dependencies {
	modImplementation "net.fabricmc:fabric-loader:$rootProject.fabricLoaderVersion"
	modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabricVersion"

	// Disabled for 1.21.8 port - need updated versions
	// modImplementation "curse.maven:roughlyenoughitems-310111:4622769"
	// modImplementation "curse.maven:justenoughitems-238222:5567930"

	common(project(path: ':common', configuration: 'namedElements')) { transitive false }
	shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
	inputs.property 'version', project.version

	// Include common resources (access widener, mixin configs, assets) for dev runtime
	from(project(':common').sourceSets.main.resources) {
		exclude 'fabric.mod.json'
	}

	filesMatching('fabric.mod.json') {
		expand version: project.version
	}
}

shadowJar {
	configurations = [project.configurations.shadowBundle]
	archiveClassifier = 'dev-shadow'
}

remapJar {
	input.set shadowJar.archiveFile
}
